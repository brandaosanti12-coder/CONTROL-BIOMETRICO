<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Salida Almuerzo</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: linear-gradient(135deg, #007BFF, #00c6ff);
  color: white;
  padding: 50px;
}

.box {
  background: white;
  color: black;
  padding: 30px;
  border-radius: 15px;
  width: 330px;
  margin: auto;
}

select, button {
  font-size: 18px;
  padding: 12px;
  margin: 10px;
  width: 100%;
}

.timer {
  font-size: 20px;
  font-weight: bold;
}

.rojo {
  color: red;
}
</style>
</head>

<body>

<div class="box">
  <h2>Salida Almuerzo</h2>

  <select id="area" onchange="cargarEmpleados()">
    <option value="">Área</option>
    <option value="PLAYA">PLAYA</option>
    <option value="FACTURACION">FACTURACIÓN</option>
    <option value="OFICINA">OFICINA</option>
  </select>

  <select id="nombre" onchange="verEstado()">
    <option value="">Nombre</option>
  </select>

  <button id="salidaBtn" onclick="registrarSalida()">Salida</button>

  <p id="horaSalida"></p>
  <p id="timer" class="timer"></p>
  <p id="msg"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "TU_API_KEY",
  authDomain: "registro-bionetrico.firebaseapp.com",
  projectId: "registro-bionetrico",
});
const db = getFirestore(app);

// 👥 EMPLEADOS
const empleados = {
  PLAYA: ["LEONARDO FLORES","RENE CHICAIZA","KEVIN ESCOBAR","ESTEBAN MALDONADO","RUBEN YANEZ"],
  FACTURACION: ["STEFANY PISANAN","DIEGO MELENDEZ","ANA MOROCHO","MARLON TENE"],
  OFICINA: ["BRANDON NAVARRETE","ANDRES SUASTE","HECTOR TORRES","IBETH BERMEO","MARIA JOSE CASTRO","MARIA JOSE SANDOVAL","JIMI CELI"]
};

// 🔄 CARGAR EMPLEADOS
window.cargarEmpleados = function () {
  const area = document.getElementById("area").value;
  const select = document.getElementById("nombre");

  select.innerHTML = '<option value="">Nombre</option>';

  empleados[area]?.forEach(n => {
    let o = document.createElement("option");
    o.value = n;
    o.textContent = n;
    select.appendChild(o);
  });
};

// 🔍 VER ESTADO
window.verEstado = async function () {
  const nombre = document.getElementById("nombre").value;
  if (!nombre) return;

  const hoy = new Date().toISOString().split("T")[0];
  const ref = doc(db, "registros", nombre + "_" + hoy);
  const snap = await getDoc(ref);

  const btn = document.getElementById("salidaBtn");

  btn.disabled = false;
  document.getElementById("horaSalida").innerText = "";
  document.getElementById("timer").innerText = "";

  if (snap.exists()) {
    const d = snap.data();

    if (d.salida) {
      btn.disabled = true;

      const salidaMs = d.salida.seconds * 1000;

      document.getElementById("horaSalida").innerText =
        "Salida: " + new Date(salidaMs).toLocaleTimeString();

      iniciarTimer(salidaMs);
    }
  }
};

// ⏱ TIMER REAL
function iniciarTimer(salida) {
  const timer = document.getElementById("timer");

  setInterval(() => {
    const ahora = Date.now();
    const diff = ahora - salida;

    const limite = 60 * 60 * 1000;
    const restante = limite - diff;

    if (restante <= 0) {
      timer.innerText = "⛔ TIEMPO EXCEDIDO";
      timer.classList.add("rojo");
      return;
    }

    const min = Math.floor(restante / 60000);
    const seg = Math.floor((restante % 60000) / 1000);

    timer.innerText = `Tiempo restante: ${min}m ${seg}s`;
  }, 1000);
}

// 🚀 REGISTRAR
window.registrarSalida = async function () {
  const nombre = document.getElementById("nombre").value;
  if (!nombre) return alert("Selecciona nombre");

  const hoy = new Date().toISOString().split("T")[0];
  const ref = doc(db, "registros", nombre + "_" + hoy);

  const snap = await getDoc(ref);

  if (snap.exists()) {
    alert("Ya registraste salida");
    return;
  }

  await setDoc(ref, {
    nombre,
    fecha: hoy,
    salida: serverTimestamp(),
    regreso: null
  });

  document.getElementById("msg").innerText = "Salida registrada";

  verEstado();
};
</script>

</body>
</html>
