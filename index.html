<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Salida Almuerzo</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: linear-gradient(135deg, #007BFF, #00c6ff);
  color: white;
  padding: 50px;
}

.box {
  background: white;
  color: black;
  padding: 30px;
  border-radius: 15px;
  width: 330px;
  margin: auto;
}

select, button {
  font-size: 18px;
  padding: 12px;
  margin: 10px;
  width: 100%;
}

.timer { font-size: 20px; font-weight: bold; }
.rojo { color: red; }
</style>
</head>

<body>

<div class="box">
  <h2>Salida Almuerzo</h2>

  <select id="area" onchange="cargarEmpleados()">
    <option value="">Área</option>
    <option value="PLAYA">PLAYA</option>
    <option value="FACTURACION">FACTURACIÓN</option>
    <option value="OFICINA">OFICINA</option>
  </select>

  <select id="nombre" onchange="verEstado()">
    <option value="">Nombre</option>
  </select>

  <button id="salidaBtn" onclick="registrarSalida()">Registrar salida</button>

  <p id="horaSalida"></p>
  <p id="timer" class="timer"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// 🔐 VALIDAR QR
const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const tipo = params.get("tipo");
const hoy = new Date().toLocaleDateString('sv-SE');

if (token !== hoy || tipo !== "salida") {
  document.body.innerHTML = "<h2 style='color:red'>Acceso solo con QR de salida</h2>";
  throw new Error("Acceso inválido");
}

// 🔥 FIREBASE
const app = initializeApp({
  apiKey: "AIzaSyCyzE_spj6e0VASt5FP50_5m2Ya-GJloM4",
  authDomain: "registro-bionetrico.firebaseapp.com",
  projectId: "registro-bionetrico"
});
const db = getFirestore(app);

// 👥 EMPLEADOS
const empleados = {
  PLAYA: ["LEONARDO FLORES","RENE CHICAIZA","KEVIN ESCOBAR","ESTEBAN MALDONADO","RUBEN YANEZ"],
  FACTURACION: ["STEFANY PISANAN","DIEGO MELENDEZ","ANA MOROCHO","MARLON TENE", "MISHELL MALDONADO"],
  OFICINA: ["BRANDON NAVARRETE","ANDRES SUASTE","HECTOR TORRES","IBETH BERMEO","MARIA JOSE CASTRO","MARIA JOSE SANDOVAL","JIMI CELI"]
};

let timerInterval = null;

window.cargarEmpleados = function () {
  const area = document.getElementById("area").value;
  const select = document.getElementById("nombre");
  select.innerHTML = '<option value="">Nombre</option>';

  empleados[area]?.forEach(n => {
    let o = document.createElement("option");
    o.value = n;
    o.textContent = n;
    select.appendChild(o);
  });
};

window.verEstado = async function () {
  const nombre = document.getElementById("nombre").value;
  if (!nombre) return;

  const ref = doc(db, "registros", nombre + "_" + hoy);
  const snap = await getDoc(ref);

  if (timerInterval) clearInterval(timerInterval);

  if (snap.exists()) {
    const d = snap.data();

    if (d.salida && d.salida.seconds) {
      const salidaMs = d.salida.seconds * 1000;

      document.getElementById("horaSalida").innerText =
        "Salida: " + new Date(salidaMs).toLocaleTimeString();

      iniciarTimer(salidaMs, nombre);
      document.getElementById("salidaBtn").disabled = true;
    }
  }
};

function iniciarTimer(salida, nombre) {
  timerInterval = setInterval(async () => {

    const ref = doc(db, "registros", nombre + "_" + hoy);
    const snap = await getDoc(ref);

    if (snap.exists()) {
      const d = snap.data();
      if (d.regreso && d.regreso.seconds) {
        clearInterval(timerInterval);
        document.getElementById("timer").innerText = "Finalizado";
        return;
      }
    }

    const restante = (3600000 - (Date.now() - salida));
    if (restante <= 0) {
      document.getElementById("timer").innerText = "EXCEDIDO";
      return;
    }

    const m = Math.floor(restante/60000);
    const s = Math.floor((restante%60000)/1000);
    document.getElementById("timer").innerText = `${m}m ${s}s`;

  }, 1000);
}

window.registrarSalida = async function () {
  const nombre = document.getElementById("nombre").value;
  if (!nombre) return alert("Selecciona nombre");

  const ref = doc(db, "registros", nombre + "_" + hoy);
  const snap = await getDoc(ref);

  if (snap.exists()) return alert("Ya registrado");

  await setDoc(ref, {
    nombre,
    fecha: hoy,
    salida: serverTimestamp(),
    regreso: null
  });

  setTimeout(verEstado, 1000);
};
</script>
</body>
</html>
