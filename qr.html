<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Retorno Almuerzo</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #28a745;
  color: white;
  padding: 50px;
}

.box {
  background: white;
  color: black;
  padding: 30px;
  border-radius: 15px;
  width: 320px;
  margin: auto;
}

select, button {
  font-size: 18px;
  padding: 12px;
  margin: 10px;
  width: 100%;
}
</style>
</head>

<body>

<div class="box">
  <h2>Retorno de Almuerzo</h2>

  <!-- AREA -->
  <select id="area" onchange="cargarEmpleados()">
    <option value="">Selecciona área</option>
    <option value="PLAYA">PLAYA</option>
    <option value="FACTURACION">FACTURACIÓN</option>
    <option value="OFICINA">OFICINA</option>
  </select>

  <!-- EMPLEADO -->
  <select id="nombre">
    <option value="">Selecciona tu nombre</option>
  </select>

  <button onclick="marcarRetorno()">Registrar retorno</button>

  <p id="msg"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, updateDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  apiKey: "AIzaSyCyzE_spj6e0VASt5FP50_5m2Ya-GJloM4",
  authDomain: "registro-bionetrico.firebaseapp.com",
  projectId: "registro-bionetrico",
};
const db = getFirestore(app);

// EMPLEADOS
const empleados = {
  PLAYA: ["LEONARDO FLORES","RENE CHICAIZA","KEVIN ESCOBAR","ESTEBAN MALDONADO","RUBEN YANEZ"],
  FACTURACION: ["STEFANY PISANAN","DIEGO MELENDEZ","ANA MOROCHO","MARLON TENE"],
  OFICINA: ["BRANDON NAVARRETE","ANDRES SUASTE","HECTOR TORRES","IBETH BERMEO","MARIA JOSE CASTRO","MARIA JOSE SANDOVAL","JIMI CELI"]
};

// REFERENCIAS
const areaSelect = document.getElementById("area");
const nombreSelect = document.getElementById("nombre");
const msg = document.getElementById("msg");

// 🔄 CARGAR EMPLEADOS
window.cargarEmpleados = function () {
  const area = areaSelect.value;

  nombreSelect.innerHTML = '<option value="">Selecciona tu nombre</option>';

  if (empleados[area]) {
    empleados[area].forEach(n => {
      const opt = document.createElement("option");
      opt.value = n;
      opt.textContent = n;
      nombreSelect.appendChild(opt);
    });
  }
};

// 🔐 VALIDAR QR DINÁMICO
function validarQR() {
  const token = new URLSearchParams(location.search).get("token");
  const hoy = new Date().toISOString().split("T")[0];

  if (token !== hoy) {
    document.body.innerHTML = "<h2>❌ QR expirado</h2>";
    return false;
  }
  return true;
}

// 🚀 REGISTRAR RETORNO
window.marcarRetorno = async function () {

  if (!validarQR()) return;

  const nombre = nombreSelect.value;

  if (!nombre) {
    alert("Selecciona tu nombre");
    return;
  }

  const hoy = new Date().toISOString().split("T")[0];
  const ref = doc(db, "registros", nombre + "_" + hoy);

  const snap = await getDoc(ref);

  if (!snap.exists()) {
    msg.innerText = "❌ No tienes salida registrada";
    return;
  }

  const data = snap.data();

  if (data.regreso) {
    msg.innerText = "⚠️ Ya registraste retorno";
    return;
  }

  await updateDoc(ref, {
    regreso: serverTimestamp()
  });

  msg.innerText = "✅ Retorno registrado correctamente";
};
</script>

</body>
</html>
