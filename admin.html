<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel de Registros</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f4f6f9;
}

h2 {
  text-align: center;
}

table {
  border-collapse: collapse;
  width: 100%;
  background: white;
}

th, td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: center;
}

th {
  background: #007BFF;
  color: white;
}

.rojo {
  color: red;
  font-weight: bold;
}

button {
  padding: 10px 15px;
  margin-bottom: 10px;
  margin-right: 10px;
  cursor: pointer;
}

.btn-nuevo {
  background-color: #27ae60;
  color: white;
  border: 1px solid #27ae60;
  border-radius: 4px;
}
</style>

<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

</head>
<body>

<h2>Panel de Registros</h2>

<button onclick="exportar()">Descargar Excel Almuerzos</button>

<button id="btn-descargar-reporte" class="btn-nuevo">Descargar Reporte Marcación Personal</button>

<button onclick="borrarTodo()" style="background:red;color:white; border: 1px solid red; border-radius: 4px;">
  Eliminar registros de los Almuerzos
</button>

<table>
<thead>
<tr>
  <th>Nombre</th>
  <th>Fecha</th>
  <th>Salida</th>
  <th>Regreso</th>
  <th>Tiempo</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfigProd = {
  apiKey: "AIzaSyCyzE_spj6e0VASt5FP50_5m2Ya-GJloM4",
  authDomain: "registro-bionetrico.firebaseapp.com",
  projectId: "registro-bionetrico",
};
const appProd = initializeApp(firebaseConfigProd);
const dbProd = getFirestore(appProd);

const firebaseConfigBiometrico = {
  apiKey: "AIzaSyB14PmZWs0Yjlx2WEqqKoHyvEHrqTweCrA",
  authDomain: "biometrico-empleados.firebaseapp.com",
  projectId: "biometrico-empleados",
  storageBucket: "biometrico-empleados.firebasestorage.app",
  messagingSenderId: "669152231455",
  appId: "1:669152231455:web:d2f7ae91e278eb854bd52a"
};
const appBiometrico = initializeApp(firebaseConfigBiometrico, "AppBiometrico");
const dbBiometrico = getFirestore(appBiometrico);

const tabla = document.getElementById("tabla");

function formatearHora(timestamp) {
  if (!timestamp || !timestamp.seconds) return "";
  return new Date(timestamp.seconds * 1000).toLocaleTimeString();
}

function calcularTiempo(salida, regreso) {
  if (!salida || !regreso) return { texto: "", exceso: false };

  const inicio = salida.seconds * 1000;
  const fin = regreso.seconds * 1000;

  const diff = (fin - inicio) / 1000; 

  const minutos = Math.floor(diff / 60);
  const horas = Math.floor(minutos / 60);
  const mins = minutos % 60;

  const texto = `${horas}h ${mins}m`;
  const exceso = minutos > 60;

  return { texto, exceso };
}

async function cargar() {
  const querySnapshot = await getDocs(collection(dbProd, "registros"));
  tabla.innerHTML = "";

  querySnapshot.forEach(docSnap => {
    const d = docSnap.data();
    const salida = formatearHora(d.salida);
    const regreso = formatearHora(d.regreso);
    const tiempo = calcularTiempo(d.salida, d.regreso);

    tabla.innerHTML += `
      <tr>
        <td>${d.nombre}</td>
        <td>${d.fecha}</td>
        <td>${salida}</td>
        <td>${regreso}</td>
        <td class="${tiempo.exceso ? 'rojo' : ''}">
          ${tiempo.texto}
        </td>
      </tr>
    `;
  });
}

window.exportar = async function () {
  const querySnapshot = await getDocs(collection(dbProd, "registros"));
  let csv = "Nombre;Fecha;Salida;Regreso;Tiempo\n";

  querySnapshot.forEach(docSnap => {
    const d = docSnap.data();
    const salida = formatearHora(d.salida);
    const regreso = formatearHora(d.regreso);
    const tiempo = calcularTiempo(d.salida, d.regreso);
    csv += `${d.nombre};${d.fecha};${salida};${regreso};${tiempo.texto}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "registros.csv";
  a.click();
};

document.getElementById('btn-descargar-reporte').addEventListener('click', async () => {
    const btn = document.getElementById('btn-descargar-reporte');
    btn.disabled = true;
    btn.innerText = "Conectando...";

    try {
        const querySnapshot = await getDocs(collection(dbBiometrico, "marcaciones"));
        const registrosExcel = [];

        querySnapshot.forEach((docSnap) => {
            const datos = docSnap.data();
            const linkEntrada = datos.enlaceGoogleMapsEntrada ? (datos.enlaceGoogleMapsEntrada.match(/href="([^"]*)/)?.[1] || "-") : "-";
            const linkSalida = datos.enlaceGoogleMapsSalida ? (datos.enlaceGoogleMapsSalida.match(/href="([^"]*)/)?.[1] || "-") : "-";

            registrosExcel.push({
                "Fecha": datos.fecha,
                "Cédula": datos.cedula,
                "Nombres": datos.nombre,
                "Ciudad": datos.ciudad,
                "Entrada": datos.horaEntrada || "-",
                "Atraso": datos.atraso || "-",
                "Mapa Entrada": linkEntrada,
                "Salida": datos.horaSalida || "Sin marcar",
                "Trabajado": datos.tiempoTrabajado || "-",
                "Horas Extras": datos.horasExtras || "-",
                "Mapa Salida": linkSalida,
                "Estado": datos.estado
            });
        });

        if (registrosExcel.length === 0) {
            alert("No hay registros guardados en la base de datos aún.");
            btn.disabled = false;
            btn.innerText = "Descargar Reporte Excel";
            return;
        }

        btn.innerText = "Generando archivo Excel...";

        const hoja = XLSX.utils.json_to_sheet(registrosExcel);
        const libro = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(libro, hoja, "Asistencia");
        
        XLSX.writeFile(libro, "Reporte_Asistencia.xlsx");
        
        btn.disabled = false;
        btn.innerText = "Descargar Reporte Excel";

    } catch (error) {
        console.error(error);
        alert("Hubo un error al descargar los datos. Revisa la consola.");
        btn.disabled = false;
        btn.innerText = "Descargar Reporte Excel";
    }
});

window.borrarTodo = async function () {
  const codigo = prompt("⚠️ Ingrese el código de autorización para eliminar TODOS los registros:");

  if (codigo !== "12345") {
      if (codigo !== null) { 
          alert("❌ Código incorrecto. Operación cancelada.");
      }
      return; 
  }

  const querySnapshot = await getDocs(collection(dbProd, "registros"));

  for (const documento of querySnapshot.docs) {
    await deleteDoc(doc(dbProd, "registros", documento.id));
  }

  alert("✅ Registros eliminados correctamente");
  cargar();
};

cargar();

</script>

</body>
</html>
