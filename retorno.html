const db = getFirestore(app);

window.retorno = async function () {

  const token = new URLSearchParams(location.search).get("token");
  const hoy = new Date().toISOString().split("T")[0];

  if (token !== hoy) {
    document.body.innerHTML = "<h2>QR expirado</h2>";
    return;
  }

  const nombre = document.getElementById("nombre").value;

  if (!nombre) return alert("Selecciona nombre");

  const ref = doc(db, "registros", nombre + "_" + hoy);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    document.getElementById("msg").innerText = "No tienes salida registrada";
    return;
  }

  if (snap.data().regreso) {
    document.getElementById("msg").innerText = "Ya registraste retorno";
    return;
  }

  await updateDoc(ref, {
    regreso: serverTimestamp()
  });

  document.getElementById("msg").innerText = "Retorno registrado";
};
