<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Retorno</title>

<style>
body { font-family: Arial; text-align:center; padding:50px; background:#28a745; color:white;}
.box {background:white;color:black;padding:30px;border-radius:10px;width:320px;margin:auto;}
.verde{color:green;font-weight:bold;}
.rojo{color:red;font-weight:bold;}
</style>
</head>

<body>

<div class="box">
<h2>Retorno</h2>

<select id="area" onchange="cargarEmpleados()">
<option value="">Área</option>
<option value="PLAYA">PLAYA</option>
<option value="FACTURACION">FACTURACIÓN</option>
<option value="OFICINA">OFICINA</option>
</select>

<select id="nombre" onchange="verEstado()">
<option value="">Nombre</option>
</select>

<button onclick="registrarRetorno()">Registrar retorno</button>

<p id="resultado"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const tipo = params.get("tipo");
const hoy = new Date().toLocaleDateString('sv-SE');

if (token !== hoy || tipo !== "retorno") {
  document.body.innerHTML = "Acceso inválido";
  throw new Error();
}

const app = initializeApp({
  apiKey:"AIzaSy...",
  authDomain:"registro-bionetrico.firebaseapp.com",
  projectId:"registro-bionetrico"
});
const db = getFirestore(app);

const empleados = {
  PLAYA:["RENE CHICAIZA","KEVIN ESCOBAR","ESTEBAN MALDONADO","RUBEN YANEZ"],
  FACTURACION:["STEFANY PISANAN","ANA MOROCHO","MARLON TENE"],
  OFICINA:["BRANDON NAVARRETE","ANDRES SUASTE","HECTOR TORRES","IBETH BERMEO","MARIA JOSE CASTRO","MARIA JOSE SANDOVAL","JIMI CELI"]
};

window.cargarEmpleados=function(){
  const a=document.getElementById("area").value;
  const s=document.getElementById("nombre");
  s.innerHTML="<option>Nombre</option>";
  empleados[a]?.forEach(n=>{
    let o=document.createElement("option");
    o.value=n;o.textContent=n;
    s.appendChild(o);
  });
};

window.verEstado=async function(){
  const nombre=document.getElementById("nombre").value;
  const ref=doc(db,"registros",nombre+"_"+hoy);
  const snap=await getDoc(ref);

  if(!snap.exists()) return;

  const d=snap.data();
  if(d.salida){
    const salida=d.salida.seconds*1000;
    window.salidaGlobal=salida;
  }
};

window.registrarRetorno=async function(){
  const nombre=document.getElementById("nombre").value;
  const ref=doc(db,"registros",nombre+"_"+hoy);

  await updateDoc(ref,{regreso:serverTimestamp()});

  const snap=await getDoc(ref);
  const d=snap.data();

  const salida=d.salida.seconds*1000;
  const regreso=d.regreso.seconds*1000;

  const usado=(regreso-salida)/60000;

  if(usado>60){
    document.getElementById("resultado").innerHTML=
    `<span class="rojo">Excedido ${Math.floor(usado-60)} min</span>`;
  }else{
    document.getElementById("resultado").innerHTML=
    `<span class="verde">Tiempo usado ${Math.floor(usado)} min</span>`;
  }
};
</script>

</body>
</html>
